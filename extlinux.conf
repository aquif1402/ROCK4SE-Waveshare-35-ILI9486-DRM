## Example only. Do not copy this file verbatim without replacing ROOT_UUID.
## The live system used a generated extlinux.conf; this file is a sanitized reference.

default l0
menu title U-Boot menu
prompt 1
timeout 10

label l0
	menu label Debian GNU/Linux 12 (bookworm) 6.1.115-8-rk2501 + Waveshare MIPI-DBI
	linux /boot/vmlinuz-6.1.115-8-rk2501
	initrd /boot/initrd.img-6.1.115-8-rk2501
	fdtdir /usr/lib/linux-image-6.1.115-8-rk2501/
	fdtoverlays /boot/dtbo/35b1-mipidbi.dtbo
	append root=UUID=ROOT_UUID video=HDMI-A-1:1280x720@60 console=ttyFIQ0,1500000n8 quiet splash loglevel=4 rw earlycon consoleblank=0 console=tty1 coherent_pool=2M irqchip.gicv3_pseudo_nmi=0 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory swapaccount=1 kasan=off
